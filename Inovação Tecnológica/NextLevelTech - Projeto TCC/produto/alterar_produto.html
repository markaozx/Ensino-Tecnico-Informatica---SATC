    <script>
        function formatPrice(input) {
            input.value = input.value.replace(',', '.');

<body>

        <div class="card">
            <h1>Alterar Produto</h1>
            <form method="POST" action="alterar_produto.php" class="form-grid columns" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="codigo">Código do Produto:</label>
                    <input type="number" id="codigo" name="codigo" min="1" required placeholder="Digite o código do produto">
                </div>
                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" name="nome" placeholder="Deixe vazio para manter o atual" maxlength="150">
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo:</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Deixe vazio para manter o atual" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="cor">Cor:</label>
                    <input type="text" id="cor" name="cor" placeholder="Deixe vazio para manter o atual" maxlength="30">
                </div>
                <div class="form-group">
                    <label for="codmarca">Código da Marca:</label>
                    <input type="number" id="codmarca" name="codmarca" placeholder="Deixe vazio para manter o atual" min="1">
                </div>
                <div class="form-group">
                    <label for="codcategoria">Código da Categoria:</label>
                    <input type="number" id="codcategoria" name="codcategoria" placeholder="Deixe vazio para manter o atual" min="1">
                </div>
                <div class="form-group">
                    <label for="preco">Preço (R$):</label>
                    <input type="number" id="preco" name="preco" step="0.01" min="0" oninput="formatPrice(this)" placeholder="Deixe vazio para manter o atual">
                </div>
                <div class="form-group">
                    <label for="estoque">Estoque:</label>
                    <input type="number" id="estoque" name="estoque" min="0" placeholder="Deixe vazio para manter o atual">
                </div>
                <div class="form-group">
                    <label for="estoque_minimo">Estoque Mínimo:</label>
                    <input type="number" id="estoque_minimo" name="estoque_minimo" min="0" placeholder="Deixe vazio para manter o atual">
                </div>
                <div class="form-group">
                    <label for="ativo">Ativo:</label>
                    <select id="ativo" name="ativo">
                        <option value="">Manter atual</option>
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" placeholder="Deixe vazio para manter a atual..."></textarea>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="especificacoes">Especificações:</label>
                    <textarea id="especificacoes" name="especificacoes" placeholder="Deixe vazio para manter as atuais..."></textarea>
                </div>
                <div class="form-group">
                    <label for="foto1">Foto 1 (opcional):</label>
                    <input type="file" id="foto1" name="foto1" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="foto2">Foto 2 (opcional):</label>
                    <input type="file" id="foto2" name="foto2" accept="image/*">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <button type="submit" name="alterar" class="btn">✏️ Alterar Produto</button>
                </div>
            </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
