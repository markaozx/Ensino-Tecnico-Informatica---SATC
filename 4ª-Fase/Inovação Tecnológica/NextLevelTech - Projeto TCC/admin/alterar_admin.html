<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Administrador - NextLevel Tech</title>
    <script>
        fetch('admin_form_styles.html')
            .then(r => r.text())
            .then(html => document.head.insertAdjacentHTML('beforeend', html));
    </script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>✏️ Alterar Administrador</div>
            <div>
                <a href="cadastro_admin.html">➕ Novo</a>
                <a href="listar_admins.php">📋 Listar</a>
                <a href="excluir_admin.html">🗑️ Excluir</a>
                <a href="../loja/menu.php">🏠 Menu</a>
            </div>
        </div>

        <div class="card">
            <h1>✏️ Alterar Administrador</h1>
            <p class="subtitle">Modifique os dados de um administrador existente</p>

            <form method="POST" action="cadastro_admin.php">
                <div class="form-group">
                    <label for="codigo">Código do Admin <span class="required">*</span></label>
                    <input type="number" id="codigo" name="codigo" required 
                           placeholder="Digite o código do administrador">
                </div>

                <div class="form-group">
                    <label for="nome">Novo Nome</label>
                    <input type="text" id="nome" name="nome" 
                           placeholder="Deixe vazio para não alterar" 
                           maxlength="100">
                </div>

                <div class="form-group">
                    <label for="email">Novo Email</label>
                    <input type="email" id="email" name="email" 
                           placeholder="Deixe vazio para não alterar" 
                           maxlength="100">
                </div>

                <div class="form-group">
                    <label for="nova_senha">Nova Senha</label>
                    <input type="password" id="nova_senha" name="nova_senha" 
                           placeholder="Deixe vazio para manter a senha atual" 
                           minlength="6">
                </div>

                <div class="form-group">
                    <label for="nivel">Novo Nível de Acesso</label>
                    <select id="nivel" name="nivel_acesso">
                        <option value="">Deixe vazio para não alterar</option>
                        <option value="1">Nível 1 - Admin Padrão</option>
                        <option value="2">Nível 2 - Super Admin</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" name="alterar" class="btn btn-success">✓ Salvar Alterações</button>
                    <a href="listar_admins.php" class="btn btn-secondary">← Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
