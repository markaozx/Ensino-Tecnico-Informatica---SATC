            background: rgba(255, 255, 255, 0.1);

            border-radius: 15px;

        h1 {
            font-family: 'Orbitron', monospace;
            text-align: center;
            margin-bottom: 25px;
            color: #4ecdc4; /* Cor de destaque para o título */
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }

        .form-delete {
            background: rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: left;
        }

        input[type="number"] {

            padding: 12px;
            border: none;

        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

        }
        
        .btn-delete {
            background: linear-gradient(45deg, #ff6b6b, #e63946);

        .btn-delete:hover {

        .menu-grid .btn {

                Atenção: A exclusão é irreversível.
            </p>
            
            <form method="GET" action="excluir_produto.php">

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Efeito de zoom nos inputs ao focar
            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
