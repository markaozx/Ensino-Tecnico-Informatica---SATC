<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - NextLevel Tech</title>
    <script>
        fetch('../admin/admin_form_styles.html')
            .then(r => r.text())
            .then(html => document.head.insertAdjacentHTML('beforeend', html));
    </script>
    <style>
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>📦 Cadastro de Produto</div>
            <div>
                <a href="cadastro_produto.html">➕ Novo</a>
                <a href="listar_produtos.php">📋 Listar</a>
                <a href="alterar_produto.html">✏️ Alterar</a>
                <a href="excluir_produto.html">🗑️ Excluir</a>
                <a href="../loja/menu.php">🏠 Menu</a>
            </div>
        </div>

        <div class="card">
            <h1>📦 Novo Produto</h1>
            <p class="subtitle">Cadastre um novo produto no catálogo</p>

            <form method="POST" action="cadastro_produto.php" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome do Produto <span class="required">*</span></label>
                        <input type="text" id="nome" name="nome" required 
                               placeholder="Ex: Mouse Gamer X" 
                               maxlength="150">
                    </div>
                    
                    <div class="form-group">
                        <label for="modelo">Modelo <span class="required">*</span></label>
                        <input type="text" id="modelo" name="modelo" required 
                               placeholder="Ex: Viper Mini" 
                               maxlength="100">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cor">Cor <span class="required">*</span></label>
                        <input type="text" id="cor" name="cor" required 
                               placeholder="Ex: Preto, RGB" 
                               maxlength="30">
                    </div>
                    
                    <div class="form-group">
                        <label for="preco">Preço (R$) <span class="required">*</span></label>
                        <input type="number" id="preco" name="preco" required 
                               step="0.01" min="0" 
                               placeholder="Ex: 199.90">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="codmarca">Marca <span class="required">*</span></label>
                        <select id="codmarca" name="codmarca" required>
                            <option value="">Selecione uma marca...</option>
                            <option value="1">Razer</option>
                            <option value="2">Logitech</option>
                            <option value="3">Corsair</option>
                            <option value="4">SteelSeries</option>
                            <option value="5">HyperX</option>
                            <option value="6">Redragon</option>
                            <option value="7">ASUS ROG</option>
                            <option value="8">Cooler Master</option>
                            <option value="9">Sennheiser</option>
                            <option value="10">Elgato</option>
                            <option value="11">RODE</option>
                            <option value="12">BenQ</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="codcategoria">Categoria <span class="required">*</span></label>
                        <select id="codcategoria" name="codcategoria" required>
                            <option value="">Selecione uma categoria...</option>
                            <option value="1">Mouse</option>
                            <option value="2">Teclado</option>
                            <option value="3">Headset</option>
                            <option value="4">Cadeira Gamer</option>
                            <option value="5">Mousepad</option>
                            <option value="6">Microfone</option>
                            <option value="7">Monitor</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="estoque">Estoque <span class="required">*</span></label>
                        <input type="number" id="estoque" name="estoque" required 
                               min="0" value="0">
                    </div>
                    
                    <div class="form-group">
                        <label for="estoque_minimo">Estoque Mínimo <span class="required">*</span></label>
                        <input type="number" id="estoque_minimo" name="estoque_minimo" 
                               min="1" value="5">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ativo">Status do Produto <span class="required">*</span></label>
                        <select id="ativo" name="ativo" required>
                            <option value="1" selected>Ativo (Disponível para venda)</option>
                            <option value="0">Inativo (Indisponível)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição <span class="required">*</span></label>
                    <textarea id="descricao" name="descricao" required 
                              placeholder="Descreva o produto..."></textarea>
                </div>

                <div class="form-group">
                    <label for="especificacoes">Especificações Técnicas <span class="required">*</span></label>
                    <textarea id="especificacoes" name="especificacoes" required 
                              placeholder="Liste as especificações do produto..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="foto1">Foto 1</label>
                        <input type="file" id="foto1" name="foto1" accept="image/*">
                    </div>
                    
                    <div class="form-group">
                        <label for="foto2">Foto 2</label>
                        <input type="file" id="foto2" name="foto2" accept="image/*">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" name="cadastrar" class="btn btn-success">✓ Cadastrar Produto</button>
                    <a href="listar_produtos.php" class="btn btn-secondary">← Voltar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
