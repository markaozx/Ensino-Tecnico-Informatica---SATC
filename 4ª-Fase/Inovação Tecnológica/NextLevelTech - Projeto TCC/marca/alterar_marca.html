            </ul>

        <div class="card">
            <h1>Alterar Marca</h1>
            <form method="POST" action="cadastro_marca.php" class="form-grid">
                <div class="form-group">
                    <label for="codigo">Código da Marca:</label>
                    <input type="number" id="codigo" name="codigo" required placeholder="Digite o código da marca" min="1">
                </div>
                <div class="form-group">
                    <label for="nome">Novo Nome da Marca:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Logitech, Razer, Corsair..." maxlength="50">
                </div>
                <div class="form-group">
                    <label for="pais">Novo País de Origem:</label>
                    <input type="text" id="pais" name="pais" required placeholder="Ex: Estados Unidos, China, Brasil..." maxlength="30">
                </div>
                <div class="form-group">
                    <button type="submit" name="alterar" class="btn">✏️ Alterar Marca</button>
                </div>
            </form>

    <script>
        // Adicionar interatividade aos formulários
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });

            // Validação em tempo real
            const nomeInput = document.getElementById('nome');
            const paisInput = document.getElementById('pais');
            const codigoInput = document.getElementById('codigo');

            nomeInput.addEventListener('input', function() {
                if (this.value.length < 2) {
                    this.style.borderColor = '#ff5252';
                } else if (this.value.length > 50) {
                    this.style.borderColor = '#ff9800';
                } else {
                    this.style.borderColor = '#4caf50';
                }
            });

            paisInput.addEventListener('input', function() {
                if (this.value.length < 2) {
                    this.style.borderColor = '#ff5252';
                } else if (this.value.length > 30) {
                    this.style.borderColor = '#ff9800';
                } else {
                    this.style.borderColor = '#4caf50';
                }
            });

            codigoInput.addEventListener('input', function() {
                if (this.value < 1) {
                    this.style.borderColor = '#ff5252';
                } else {
                    this.style.borderColor = '#4caf50';
                }
            });

            // Transformar primeira letra em maiúscula
            nomeInput.addEventListener('blur', function() {
                this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
            });

            paisInput.addEventListener('blur', function() {
                this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
            });
        });
    </script>
